# PowerSync Sync Rules

# This file defines which data from the backend Postgres database
# should be synced to the local SQLite databases on client devices.

# Each entry represents a "sync bucket". The queries within a bucket
# are executed on the backend, and the results are published to clients.

bucket_definitions:
  global:
    data:
      - SELECT * FROM users;
      - SELECT * FROM device;
      - SELECT * FROM location;
      - SELECT * FROM vehicle;
      - SELECT * FROM water_readings;